server {
    listen 80;
    server_name your-domain.com; # Replace with your domain name or server IP

    # Maximum file upload size if needed
    client_max_body_size 100M;

    # Root directory pointing to built Vite frontend
    root /home/ubuntu/clip_studio/frontend/dist;
    index index.html;

    # Gzip compression for fast UI loading
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # 1. API Endpoints Proxy
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Important for video downloads (prevents 504 Gateway Timeout during yt-dlp processing)
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # 2. Video Streaming & Downloads
    # Directly served by Nginx for high-performance HTTP range requests (seeking in video player)
    location /downloads/ {
        alias /home/ubuntu/clip_studio/downloads/;
        
        # Enable optimal streaming
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;

        # Support byte-range requests for video seek bar
        add_header Accept-Ranges bytes;
        add_header Cache-Control "public, max-age=86400";
    }

    # 3. Static Assets Caching
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 4. Frontend SPA Routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
